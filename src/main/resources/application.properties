spring.application.name=smartia-backend
server.port=8081

# Muestra el mensaje real de los errores (la app lo usa)
server.error.include-message=always

# MariaDB de XAMPP (base de datos compartida con Django)
spring.datasource.url=jdbc:mariadb://localhost:3306/smartia
spring.datasource.username=root
spring.datasource.password=

# La BD se crea con smartia.sql, Spring NO toca el esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# IA (Gemini). La clave va en variable de entorno, NO en el codigo ni en git
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}